name: Lighthouse (static site)

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/tools/dev/lighthouserc.js"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Run Lighthouse CI (collect only, no assert)
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci collect --config=./.github/tools/dev/lighthouserc.js
