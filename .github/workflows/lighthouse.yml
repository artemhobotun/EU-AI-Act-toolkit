name: Lighthouse (static site)

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/tools/dev/lighthouserc.js"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Run Lighthouse CI (collect only, no assert)
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci collect --config=./.github/tools/dev/lighthouserc.js
