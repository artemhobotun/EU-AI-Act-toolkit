name: Build, Check, Lint & Validate

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.html'
      - 'toolkit/**/*.md'
      - 'scratch/build-*.js'
      - 'scratch/validate-*.js'
      - 'scratch/bump-*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate front-matter in templates
        run: node scratch/validate-frontmatter.js

      - name: Build Search Index
        run: node scratch/build-search.js

      - name: Build API JSONs (with front-matter metadata)
        run: node scratch/build-api.js

      - name: Build Template Versions snapshot
        run: node scratch/build-versions.js

      - name: Check for broken internal links
        run: node scratch/check-links.js

      - name: Lint Markdown files
        run: |
          npx --yes markdownlint-cli \
            --config .github/linters/.markdownlint.json \
            'toolkit/**/*.md' \
            --ignore 'toolkit/**/README.md'

      - name: Check external links in Markdown
        run: |
          npx --yes markdown-link-check \
            --config .github/linters/.mlc-config.json \
            $(find toolkit -name "*.md" | head -20)
        continue-on-error: true

      - name: Auto-commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update search index and API JSONs"
          file_pattern: "docs/search-index.json docs/api/*.json"
