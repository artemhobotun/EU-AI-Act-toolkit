name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          release-type: simple
          package-name: eu-ai-act-toolkit
          changelog-types: |
            [
              {"type":"feat","section":"✨ New Features"},
              {"type":"fix","section":"🐛 Bug Fixes"},
              {"type":"docs","section":"📚 Documentation"},
              {"type":"content","section":"📋 Content Updates"},
              {"type":"chore","section":"🔧 Maintenance","hidden":true}
            ]
