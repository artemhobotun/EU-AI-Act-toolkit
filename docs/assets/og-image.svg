<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1117"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- EU Flag emoji area (circle bg) -->
  <circle cx="120" cy="315" r="80" fill="#1e2433" opacity="0.8"/>
  <text x="120" y="345" font-size="80" text-anchor="middle" font-family="Arial">🇪🇺</text>

  <!-- Divider line -->
  <rect x="220" y="200" width="2" height="230" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Main title -->
  <text x="260" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="700" fill="#ffffff">EU AI Act Toolkit</text>

  <!-- Subtitle -->
  <text x="260" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8">Practical compliance templates for real teams.</text>

  <!-- Badges row -->
  <rect x="260" y="370" width="210" height="40" rx="20" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="365" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">91+ Templates</text>

  <rect x="490" y="370" width="210" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.2"/>
  <text x="595" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle">Open Source</text>

  <rect x="720" y="370" width="210" height="40" rx="20" fill="#10b981" fill-opacity="0.2"/>
  <text x="825" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">Free Forever</text>

  <!-- Bottom caption -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">artemhobotun.github.io/EU-AI-Act-Toolkit</text>
</svg>
